spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smarttrafficflow}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    remoteip:
      # Empty by default: the API is reached directly and X-Forwarded-For must not be trusted.
      # Behind the web container (Caddy) the Compose file sets it to X-Forwarded-For.
      remote-ip-header: ${APP_CLIENT_IP_HEADER:}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173}
  rate-limit:
    simulations-per-minute: ${APP_RATE_LIMIT_SIMULATIONS_PER_MINUTE:5}
    traffic-records-per-minute: ${APP_RATE_LIMIT_TRAFFIC_RECORDS_PER_MINUTE:30}
  streets:
    import:
      enabled: ${APP_STREETS_IMPORT_ENABLED:false}
      geojson-path: ${APP_STREETS_IMPORT_GEOJSON_PATH:}
